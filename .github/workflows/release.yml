name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: windows-2022
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a tag that already has a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} 2>&1 | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { throw 'a release for ${{ github.ref_name }} already exists: raise the version instead of moving the tag' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pwsh -File build.ps1
      - run: pwsh -File tests\run.ps1
      - name: Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\memreader_plus.dll, ..\memreader_plus.pack release\
          Get-ChildItem release | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii SHA256SUMS.txt
          Move-Item SHA256SUMS.txt release\
          Get-Content release\SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/memreader_plus.dll
            release/memreader_plus.pack
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/memreader_plus.dll
            release/memreader_plus.pack
            release/SHA256SUMS.txt
      - name: VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            release/memreader_plus.dll
            release/memreader_plus.pack
      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lines = @('Files built by GitHub Actions from this tag.', '', 'SHA-256:')
          $sums = Get-Content release\SHA256SUMS.txt | ForEach-Object { $hash, $name = $_ -split '  '; [pscustomobject]@{ Hash = $hash; Name = $name } }
          $sums | ForEach-Object { $lines += "- ``$($_.Name)`` $($_.Hash)" }
          $lines += '', 'VirusTotal:'
          $sums | ForEach-Object { $lines += "- [$($_.Name)](https://www.virustotal.com/gui/file/$($_.Hash))" }
          $lines += '', 'Check that a file came from this build: `gh attestation verify memreader_plus.pack -R ${{ github.repository }}`'
          $lines | Set-Content -Encoding utf8 notes.md
          gh release edit ${{ github.ref_name }} --notes-file notes.md
